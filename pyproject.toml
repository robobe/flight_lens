[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "flight-lens"
version = "0.1.0"
description = "Offline desktop MCAP flight overview and event investigation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "bullet-msgs",
    "mcap>=1.3,<2",
    "foxglove-schemas-protobuf>=0.3,<0.4",
    "jsonschema>=4,<5",
    "numpy>=2,<3",
    "pyside6-essentials>=6.8,<7",
    "pyqtgraph>=0.13.7,<0.15",
]

[project.scripts]
flight-lens = "flight_lens.app:main"

[dependency-groups]
dev = ["pytest>=9,<10"]

[tool.uv.sources]
bullet-msgs = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
